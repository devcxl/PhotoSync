name: Android CI

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Lint & unit tests
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    submodules: recursive

            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: '17'

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v3

            -   name: Install Android SDK components (API 36, NDK, CMake) and accept licenses
                shell: bash
                run: |
                    yes | sdkmanager --licenses || true
                    sdkmanager --install \
                        "platform-tools" \
                        "platforms;android-36" \
                        "build-tools;36.0.0" \
                        "ndk;29.0.14033849" \
                        "cmake;3.22.1"

            -   name: Point local.properties to CI Android SDK
                run: |
                    echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

            -   name: Align Gradle JDK with runner JAVA_HOME
                run: |
                    sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
                    echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties

            -   name: Make gradlew executable
                run: chmod +x gradlew

            -   name: Run unit tests
                run: ./gradlew --no-daemon :app:testDebugUnitTest

            -   name: Run Android lint
                run: ./gradlew --no-daemon :app:lintDebug

            -   name: Upload test report
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-results
                    path: app/build/reports/tests/
                    if-no-files-found: ignore

            -   name: Upload lint report
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: lint-results
                    path: app/build/reports/lint-results-debug.*
                    if-no-files-found: ignore
